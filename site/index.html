<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090d12" />
  <title>HackerDeck 3D — Locked</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090d12;color:#eef6ff}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% -10%,#173047 0,#0c131c 36%,#090d12 72%);display:grid;place-items:center;padding:24px}
    .gate{width:min(94vw,430px);background:rgba(14,21,30,.92);border:1px solid #263545;border-radius:22px;padding:24px;box-shadow:0 24px 80px #0008;backdrop-filter:blur(12px)}
    .eyebrow{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:#7dd3fc;margin-bottom:8px}.gate h1{font-size:clamp(1.7rem,6vw,2.2rem);margin:0 0 8px}.gate p{color:#a9b7c6;line-height:1.5;margin:0 0 20px}
    label{display:block;font-size:.84rem;color:#c7d2df;margin:0 0 8px}input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid #314354;background:#0a1118;color:white;font:inherit;outline:none}input:focus{border-color:#38bdf8;box-shadow:0 0 0 3px #38bdf822}
    button{width:100%;margin-top:12px;border:0;border-radius:13px;padding:14px 16px;background:#38bdf8;color:#04121a;font-weight:800;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    .status{min-height:1.4em;margin-top:12px;font-size:.86rem;color:#fca5a5}.small{font-size:.74rem;color:#6f8192;margin-top:16px}.brand{display:flex;align-items:center;gap:9px;margin-bottom:18px}.dot{width:11px;height:11px;border-radius:50%;background:#4ade80;box-shadow:0 0 18px #4ade80}
  </style>
</head>
<body>
  <main class="gate" id="gate">
    <div class="brand"><span class="dot"></span><strong>HackerDeck / Private Preview</strong></div>
    <div class="eyebrow">Encrypted static build</div>
    <h1>3D Hardware Lab</h1>
    <p>Die eigentliche Website liegt verschlüsselt auf GitHub Pages. Ohne das Passwort wird der 3D-Inhalt nicht entschlüsselt.</p>
    <form id="unlockForm">
      <label for="password">Passwort</label>
      <input id="password" name="password" type="password" autocomplete="current-password" spellcheck="false" autofocus />
      <button id="unlockBtn" type="submit">Entsperren</button>
      <div class="status" id="status" role="status"></div>
    </form>
    <div class="small">PBKDF2-SHA-256 · AES-GCM · Das Passwort ist nicht im ausgelieferten HTML gespeichert.</div>
  </main>
<script type="module">
const enc = new TextEncoder();
const dec = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(password, salt, iterations){
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'}, base, {name:'AES-GCM',length:256}, false, ['decrypt']);
}
async function unlock(password){
  const metaRes = await fetch('./protected/payload-meta.json',{cache:'no-store'});
  if(!metaRes.ok) throw new Error('Payload-Metadaten konnten nicht geladen werden.');
  const p = await metaRes.json();
  const chunks = await Promise.all(p.chunks.map(async file => {
    const res = await fetch('./protected/'+file,{cache:'no-store'});
    if(!res.ok) throw new Error('Payload-Chunk konnte nicht geladen werden.');
    return res.text();
  }));
  const key = await derive(password,b64(p.salt),p.iterations);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(chunks.join('')));
  return dec.decode(plain);
}
function ensureThreeImportMap(html){
  if(html.includes('type="importmap"')) return html;
  const importMap = '<scr'+'ipt type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</scr'+'ipt>';
  return html.replace('</head>', importMap+'</head>');
}
const form=document.getElementById('unlockForm'),btn=document.getElementById('unlockBtn'),status=document.getElementById('status');
form.addEventListener('submit',async e=>{
  e.preventDefault(); const password=document.getElementById('password').value;
  if(!password){status.textContent='Bitte Passwort eingeben.';return}
  btn.disabled=true;status.style.color='#a9b7c6';status.textContent='Entschlüssele…';
  try{
    const html=ensureThreeImportMap(await unlock(password));
    sessionStorage.setItem('hd-unlocked','1');
    document.open();document.write(html);document.close();
  }catch(err){
    console.error(err);status.style.color='#fca5a5';status.textContent='Falsches Passwort oder beschädigter Build.';btn.disabled=false;
  }
});
</script>
</body>
</html>
